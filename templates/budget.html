<!DOCTYPE html>
<html>
<head>
    <title>Set Budget</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Set Monthly Budget</h1>

    <div class="nav-links">
        <a href="/dashboard">Back to Dashboard</a>
    </div>

    <form method="POST">
        <p>Month: {{ current_month }}</p>

        <p>
            Monthly Budget:<br>
            <input 
                type="number" 
                step="0.01" 
                name="amount" 
                value="{% if budget_row %}{{ budget_row.amount }}{% endif %}"
                required
            >
        </p>

        <button type="submit">Save Budget</button>
    </form>
</body>
</html>
